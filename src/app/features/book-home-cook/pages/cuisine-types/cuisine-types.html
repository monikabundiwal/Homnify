<p>cuisine-types works!</p>
<div class="wrap">
  <h2>Cuisine Types</h2>
  <p class="sub">Select cuisines you prefer.</p>

  <div class="chips">
    <button class="chip"
            *ngFor="let c of options"
            type="button"
            [class.on]="form.controls.selections.value.includes(c)"
            (click)="toggle(c)">
      {{ c }}
    </button>
  </div>

  <div class="nav">
    <button class="btn ghost" type="button" (click)="back()">‹ BACK</button>
    <button class="btn primary" type="button" (click)="next()">NEXT ›</button>
  </div>
</div>
